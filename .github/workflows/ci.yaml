name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      # These are the latest versions of the github actions; dependabot will
      # send PRs to keep these up-to-date.
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: master

      - name: Version
        run: |
          flutter --version
          dart --version

      - name: Precache Flutter engine artifacts
        run: flutter precache --universal --linux

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: dart analyze --fatal-infos

      # Each `run:` step runs in a fresh shell, so a plain bash variable
      # wouldn't survive to the next step. Writing to $GITHUB_ENV exports
      # PACKAGES so the Test and Cycles steps below can read it.
      - name: Find packages
        run: |
          pkgs=$(find . -mindepth 2 -name pubspec.yaml -not -path '*/.dart_tool/*' | xargs -n1 dirname | sort)
          echo "Found packages:"
          echo "$pkgs"
          {
            echo "PACKAGES<<EOF"
            echo "$pkgs"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Test packages
        run: |
          set -e
          while IFS= read -r pkg; do
            echo "::group::Test $pkg"
            (cd "$pkg" && flutter test)
            echo "::endgroup::"
          done <<< "$PACKAGES"

      # The example package has intentional cycles to demo layerlens, so
      # skip it here.
      - name: Check for cycles in packages
        run: |
          set -e
          while IFS= read -r pkg; do
            if [[ "$pkg" == "./pkgs/layerlens/example" ]]; then
              echo "Skip cycles check for $pkg (intentional cycles)"
              continue
            fi
            echo "::group::Cycles $pkg"
            (cd "$pkg" && dart run layerlens --fail-on-cycles --fail-if-changed)
            echo "::endgroup::"
          done <<< "$PACKAGES"
