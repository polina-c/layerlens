name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      # These are the latest versions of the github actions; dependabot will
      # send PRs to keep these up-to-date.
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: master

      - name: Version
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Find packages
        id: packages
        run: |
          pkgs=$(find . -mindepth 2 -name pubspec.yaml -not -path '*/.dart_tool/*' | xargs -n1 dirname | sort)
          echo "Found packages:"
          echo "$pkgs"
          {
            echo "list<<EOF"
            echo "$pkgs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Test packages
        run: |
          set -e
          while IFS= read -r pkg; do
            echo "::group::Test $pkg"
            (cd "$pkg" && flutter test)
            echo "::endgroup::"
          done <<< "${{ steps.packages.outputs.list }}"

      - name: Check for cycles in packages
        run: |
          set -e
          while IFS= read -r pkg; do
            echo "::group::Cycles $pkg"
            (cd "$pkg" && dart run layerlens --fail-on-cycles --fail-if-changed)
            echo "::endgroup::"
          done <<< "${{ steps.packages.outputs.list }}"
